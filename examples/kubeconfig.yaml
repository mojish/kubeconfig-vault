# Offline example for "kubeconfig-vault setup --check". No real credentials.
apiVersion: v1
kind: Config
clusters:
  - name: demo
    cluster:
      server: https://kubernetes.example.invalid
users:
  - name: demo-user
    user:
      token: demo-only-not-a-real-token
contexts:
  - name: demo
    context:
      cluster: demo
      user: demo-user
current-context: demo

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kube unlock</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/vault.js"></script>
</head>
<body>
  <main>
    <p class="eyebrow">KUBE UNLOCK · ON THIS LAPTOP</p>
    <h1>Unlock your configuration</h1>
    <section aria-labelledby="status">
      <p id="status" role="status" aria-live="polite">Preparing…</p>
      <label for="key">Security key</label>
      <select id="key" aria-label="Security key" hidden></select>
      <p><button id="continue" type="button" disabled>Preparing…</button></p>
      <button id="cancel" type="button">Cancel</button>
      <p id="error" role="alert"></p>
    </section>
    <p class="note">Enter your YubiKey PIN only in the browser’s security-key dialog. This page never asks you to type a PIN or Kubernetes token.</p>
  </main>
</body>
</html>

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      session_trial:
        description: Run the full-hour session trial on one platform
        type: choice
        default: ordinary
        options: [ordinary, ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
      freelens_desktop:
        description: Exercise the actual Freelens desktop on each native runner
        type: boolean
        default: false
      published_release:
        description: Optional published tag to use for the client integration tests (for example v0.5.0)
        type: string
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.session_trial || 'ordinary' }}-${{ inputs.freelens_desktop || false }}-${{ inputs.published_release }}
  cancel-in-progress: true

jobs:
  test:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == inputs.session_trial && 90 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    defaults:
      run:
        shell: bash
        working-directory: age-app
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check links and headings in the guides
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 -B ../scripts/test_doc_links.py
          python3 -B ../scripts/check_doc_links.py
      - name: Use the same Go caches for setup and integration tests
        run: |
          printf 'GOPATH=%s/kube-unlock-go-path\nGOCACHE=%s/kube-unlock-go-cache\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: age-app/package-lock.json
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: age-app/go.mod
          cache-dependency-path: age-app/go.sum
      - name: Validate workflow syntax and shell commands
        if: matrix.os == 'ubuntu-24.04'
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 ../.github/workflows/*.yml
          shellcheck ../install.sh ../scripts/*.sh
      - name: Install locked dependencies and build browser assets
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          go mod download
          go mod verify
          npm run build:web
      - name: Check formatting and static analysis
        run: |
          unformatted=$(gofmt -l ./*.go)
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
      - name: Test native security boundaries and browser UI state
        run: |
          go test -race -count=1 -timeout=5m ./...
          npm run test:ui
          sh ../scripts/test-install.sh
          python3 -B ../scripts/test_public_install.py
      - name: Build native executable
        run: |
          go build -trimpath -o kubeconfig-vault .
          ./kubeconfig-vault --help
      - uses: ./.github/actions/browser-clients
      - name: Install the verified Freelens desktop on the temporary Linux runner
        if: runner.os == 'Linux' && inputs.freelens_desktop
        run: |
          arch=$(dpkg --print-architecture)
          case "$arch" in
            arm64) digest=696a4f184bef4313ec04610b9e30175b8cd47800f3d2938e5118d3025e54ce6f ;;
            amd64) digest=821b32bb18eccd06a4b5a3a7f5d503e3ef4bd17e4b41e82317e5379efbac0baf ;;
            *) exit 1 ;;
          esac
          file="$RUNNER_TEMP/Freelens.deb"
          curl -q -fsSL --proto '=https' --proto-redir '=https' --retry 2 --max-time 240 \
            "https://github.com/freelensapp/freelens/releases/download/v2.1.0/Freelens-2.1.0-linux-$arch.deb" -o "$file"
          echo "$digest  $file" | sha256sum -c -
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends "$file" xvfb xauth
          desktop=$(command -v freelens)
          printf 'KUBE_UNLOCK_TEST_FREELENS_DESKTOP=%s\n' "$desktop" >> "$GITHUB_ENV"
      - name: Mount the verified Freelens desktop for the Mac trial
        if: runner.os == 'macOS' && inputs.freelens_desktop
        run: |
          case "$(uname -m)" in
            arm64) arch=arm64; digest=d4e0155c429e828edd5c0fdd111e0dfd21810e638d2baac951a677f7d89e6300 ;;
            x86_64) arch=amd64; digest=f283b3dea60206e0bc60b1941091aa63635a909d424e5fc89c2c115e2c3791b3 ;;
            *) exit 1 ;;
          esac
          image="$RUNNER_TEMP/Freelens.dmg"
          volume="$RUNNER_TEMP/kcv-freelens-volume"
          curl -q -fsSL --proto '=https' --proto-redir '=https' --retry 2 --max-time 240 \
            "https://github.com/freelensapp/freelens/releases/download/v2.1.0/Freelens-2.1.0-macos-$arch.dmg" -o "$image"
          echo "$digest  $image" | shasum -a 256 -c -
          mkdir "$volume"
          hdiutil attach -readonly -nobrowse -noautoopen -mountpoint "$volume" "$image"
          echo 'KCV_FREELENS_MOUNTED=1' >> "$GITHUB_ENV"
          desktop="$volume/Freelens.app/Contents/MacOS/Freelens"
          test -x "$desktop"
          printf 'KUBE_UNLOCK_TEST_FREELENS_DESKTOP=%s\n' "$desktop" >> "$GITHUB_ENV"
      - name: Check out the v0.3.0 upgrade fixture
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 346b9be287292ed4fb9d6d0385a3d828db26b137
          path: previous-release
          persist-credentials: false
      - name: Build the previous release for the kubectl upgrade test
        if: matrix.os == 'ubuntu-24.04'
        working-directory: previous-release/age-app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:web
          go build -trimpath -ldflags '-X main.version=v0.3.0' -o "$RUNNER_TEMP/kcv-previous" .
          echo "KUBE_UNLOCK_TEST_PREVIOUS_BINARY=$RUNNER_TEMP/kcv-previous" >> "$GITHUB_ENV"
      - name: Install the selected public release for the client tests
        if: inputs.published_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.published_release }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a release tag such as v0.5.0' >&2; exit 1; }
          os=linux
          if [[ "$RUNNER_OS" == macOS ]]; then os=darwin; fi
          case "$RUNNER_ARCH" in
            ARM64) cpu=arm64 ;;
            X64) cpu=amd64 ;;
            *) echo "Unsupported runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          archive="kubeconfig-vault-$os-$cpu.tar.gz"
          dir=$(mktemp -d "$RUNNER_TEMP/kcv-published.XXXXXX")
          gh release download "$TAG" -R mojish/kubeconfig-vault -D "$dir" -p "$archive" -p SHA256SUMS -p install.sh
          for file in "$archive" SHA256SUMS install.sh; do
            gh release verify-asset "$TAG" "$dir/$file" -R mojish/kubeconfig-vault
          done
          unset GH_TOKEN
          sh "$dir/install.sh" --from-dir "$dir" "$dir/bin"
          binary="$dir/bin/kubeconfig-vault"
          [[ "$("$binary" --version)" == "kubeconfig-vault $TAG" ]]
          printf 'KUBE_UNLOCK_TEST_BINARY=%s\n' "$binary" >> "$GITHUB_ENV"
      - name: Test synthetic browser and kubectl integration
        env:
          FULL_HOUR: ${{ matrix.os == inputs.session_trial }}
        run: |
          command=(npm run test:browser)
          if [[ "$FULL_HOUR" == true ]]; then command+=(-- --one-hour-session); fi
          if [[ "$RUNNER_OS" == Linux && -n "${KUBE_UNLOCK_TEST_FREELENS_DESKTOP:-}" ]]; then
            exec xvfb-run -a "${command[@]}"
          fi
          exec "${command[@]}"
      - name: Detach the temporary Freelens disk image
        if: always() && runner.os == 'macOS' && inputs.freelens_desktop
        run: |
          volume="$RUNNER_TEMP/kcv-freelens-volume"
          if [[ "${KCV_FREELENS_MOUNTED:-}" == 1 ]]; then hdiutil detach "$volume"; fi
      - name: Check dependency advisories
        if: matrix.os == 'ubuntu-24.04'
        run: npm run audit:security

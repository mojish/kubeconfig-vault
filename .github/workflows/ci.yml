name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      session_trial:
        description: Run the full-hour session trial on one platform
        type: choice
        default: ordinary
        options: [ordinary, ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.session_trial || 'ordinary' }}
  cancel-in-progress: true

jobs:
  test:
    name: Native tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == inputs.session_trial && 90 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    defaults:
      run:
        shell: bash
        working-directory: age-app
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the same Go caches for setup and integration tests
        run: |
          printf 'GOPATH=%s/kube-unlock-go-path\nGOCACHE=%s/kube-unlock-go-cache\n' \
            "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: age-app/package-lock.json
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: age-app/go.mod
          cache-dependency-path: age-app/go.sum
      - name: Validate workflow syntax and shell commands
        if: matrix.os == 'ubuntu-24.04'
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 ../.github/workflows/*.yml
          shellcheck ../install.sh ../scripts/*.sh
      - name: Install locked dependencies and build browser assets
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          go mod download
          go mod verify
          npm run build:web
      - name: Check formatting and static analysis
        run: |
          unformatted=$(gofmt -l ./*.go)
          if [[ -n "$unformatted" ]]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
      - name: Test native security boundaries and browser UI state
        run: |
          go test -race -count=1 -timeout=5m ./...
          npm run test:ui
          sh ../scripts/test-install.sh
          python3 -B ../scripts/test_public_install.py
      - name: Build native executable
        run: |
          go build -trimpath -o kubeconfig-vault .
          ./kubeconfig-vault --help
      - uses: ./.github/actions/browser-clients
      - name: Check out the v0.3.0 upgrade fixture
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 346b9be287292ed4fb9d6d0385a3d828db26b137
          path: previous-release
          persist-credentials: false
      - name: Build the previous release for the kubectl upgrade test
        if: matrix.os == 'ubuntu-24.04'
        working-directory: previous-release/age-app
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build:web
          go build -trimpath -ldflags '-X main.version=v0.3.0' -o "$RUNNER_TEMP/kcv-previous" .
          echo "KUBE_UNLOCK_TEST_PREVIOUS_BINARY=$RUNNER_TEMP/kcv-previous" >> "$GITHUB_ENV"
      - name: Test synthetic browser and kubectl integration
        if: matrix.os != inputs.session_trial
        run: npm run test:browser
      - name: Verify a full-hour session with real kubectl requests
        if: matrix.os == inputs.session_trial
        run: npm run test:browser -- --one-hour-session
      - name: Check dependency advisories
        if: matrix.os == 'ubuntu-24.04'
        run: npm run audit:security

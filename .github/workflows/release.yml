name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['scripts/package-release.sh', '.github/workflows/release.yml']
  workflow_dispatch:

env:
  PACKAGE_TAG: ${{ github.event_name == 'push' && github.ref_name || 'v0.0.0' }}

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.build }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        build: [primary, rebuild]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: age-app/package-lock.json
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: age-app/go.mod
          cache-dependency-path: age-app/go.sum
          cache: ${{ matrix.build == 'primary' }}
      - name: Package the four targets
        env:
          BUILD: ${{ matrix.build }}
        run: |
          if [[ "$BUILD" == rebuild ]]; then
            umask 077
            export GOCACHE="$RUNNER_TEMP/rebuild-go-cache"
          fi
          ./scripts/package-release.sh "$PACKAGE_TAG" "$RUNNER_TEMP/kcv-release"
      - name: Test immutable download URLs in the published installer
        if: matrix.build == 'primary'
        run: sh scripts/test-install.sh "$RUNNER_TEMP/kcv-release/install.sh" "$PACKAGE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.build == 'primary'
        with:
          name: release-assets
          path: ${{ runner.temp }}/kcv-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.build == 'rebuild'
        with:
          name: rebuilt-checksums
          path: ${{ runner.temp }}/kcv-release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Install release (${{ matrix.runner }})
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/kcv-release/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: matrix.runner == 'ubuntu-24.04'
        with:
          name: rebuilt-checksums
          path: ${{ runner.temp }}/rebuilt
      - name: Verify all release bytes against the second runner's rebuild
        if: matrix.runner == 'ubuntu-24.04'
        working-directory: ${{ runner.temp }}/kcv-release
        run: |
          cmp SHA256SUMS "$RUNNER_TEMP/rebuilt/SHA256SUMS"
          sha256sum -c "$RUNNER_TEMP/rebuilt/SHA256SUMS"
      - name: Verify and run the packaged executable
        shell: bash
        run: |
          sh "$RUNNER_TEMP/kcv-release/install.sh" --from-dir "$RUNNER_TEMP/kcv-release" "$RUNNER_TEMP/kcv bin"
          version=$("$RUNNER_TEMP/kcv bin/kubeconfig-vault" --version)
          test "$version" = "kubeconfig-vault $PACKAGE_TAG"
          test "$(readlink "$RUNNER_TEMP/kcv bin/kube-unlock-age")" = kubeconfig-vault
          test "$("$RUNNER_TEMP/kcv bin/kube-unlock-age" --version)" = "$version"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: age-app/go.mod
          cache: false
      - uses: ./.github/actions/browser-clients
      - name: Exercise the packaged CLI with virtual USB authentication and kubectl
        working-directory: age-app
        shell: bash
        env:
          KUBE_UNLOCK_TEST_BINARY: ${{ runner.temp }}/kcv bin/kubeconfig-vault
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node physical.test.mjs --preflight-only
          node physical.test.mjs --preflight-only --client-certificate
          npm run test:browser

  draft:
    if: github.event_name == 'push'
    needs: [test, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: ${{ runner.temp }}/kcv-release/
      - name: Verify all assets against the manifest
        working-directory: ${{ runner.temp }}/kcv-release
        run: sha256sum -c SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/kcv-release/kubeconfig-vault-*.tar.gz
            ${{ runner.temp }}/kcv-release/install.sh
            ${{ runner.temp }}/kcv-release/SHA256SUMS
      - name: Create a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/kcv-release/* \
            --draft --verify-tag --title "Kubeconfig Vault $GITHUB_REF_NAME" \
            --notes "Experimental binaries for Linux and macOS on x86-64 and ARM64. See the README for installation, compatibility, and security boundaries."

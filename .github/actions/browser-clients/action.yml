name: Prepare browser integration clients
description: Check the native Chrome and kubectl used with the disposable test API.
runs:
  using: composite
  steps:
    - name: Install signed stable Chrome on the Linux ARM64 runner
      if: runner.os == 'Linux' && runner.arch == 'ARM64'
      shell: bash
      run: |
        if command -v google-chrome >/dev/null; then exit 0; fi
        curl -fsS --retry 3 https://dl.google.com/linux/linux_signing_key.pub -o "$RUNNER_TEMP/google-linux.asc"
        sudo install -m 0644 "$RUNNER_TEMP/google-linux.asc" /usr/share/keyrings/kcv-google.asc
        # Restrict this repository to Google's active Linux package signing authority.
        echo 'deb [arch=arm64 signed-by=/usr/share/keyrings/kcv-google.asc,EB4C1BFD4F042F6DDDCCEC917721F63BD38B4796] https://dl.google.com/linux/chrome/deb/ stable main' |
          sudo tee /etc/apt/sources.list.d/kcv-chrome.list >/dev/null
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends google-chrome-stable
    - name: Check native client versions
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == macOS ]]; then
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
          command -v kubectl >/dev/null || brew install kubectl
        else
          google-chrome --version
        fi
        kubectl version --client
        openssl version
